
services:

  # -------------------------------------------------
  # Prometheus
  # -------------------------------------------------
  #
  # Development-only Prometheus instance.
  # Prometheus itself is NOT exposed directly to the host --
  # only the dodbanner proxy below is exposed.
  #
  # UI:
  #   http://localhost:9999
  #

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    expose:
      - "9090"


  # -------------------------------------------------
  # DoD Banner Injection Proxy
  # -------------------------------------------------
  #
  # Host:
  #   http://localhost:9999
  #

  dodbanner:
    image: dodbanner:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      BACKEND_HOST: prometheus
      BACKEND_PORT: "9090"
      LISTEN_PORT: "9999"

      # Prometheus serves its UI from multiple paths but uses
      # static assets under /static and /web.
      #
      # Start by injecting into HTML responses while excluding
      # JavaScript, CSS, images, fonts, maps, and JSON assets.
      INJECT_PATH_REGEX: "^/(?!.*\\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map|json)$).*"

      INJECT_BEFORE: "</head>"
      INJECT_CSS: "prometheus-banner.css"

      CLASSIFICATION: "UNCLASSIFIED"
      CLASSIFICATION_LABEL: "smeg"

    depends_on:
      - prometheus
