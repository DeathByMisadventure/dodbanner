services:
# -------------------------------------------------
  # PostgreSQL (optional but useful)
  # -------------------------------------------------
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
    # Not exposed to host – only visible to pgAdmin

  # -------------------------------------------------
  # pgAdmin
  # -------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Optional: make it a bit less annoying for testing
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    # Only exposed internally
    expose:
      - "80"
    depends_on:
      - postgres

  # -------------------------------------------------
  # DoD Banner Injection Proxy
  # -------------------------------------------------
  dodbanner:
    image: dodbanner:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      BACKEND_HOST: pgadmin
      BACKEND_PORT: "80"
      LISTEN_PORT: "9999"
      INJECT_PATH_REGEX: "^/(?:browser)?/?$"
      INJECT_BEFORE: "</head>"
      INJECT_CSS: "pgadmin-banner.css"
      CLASSIFICATION: "UNCLASSIFIED"
      CLASSIFICATION_LABEL: "SMEG"
