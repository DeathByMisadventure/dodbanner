
services:
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
    container_name: artifactory
    restart: unless-stopped
    ports:
      - "8081:8081"   # API / legacy
      - "8082:8082"   # UI (main entry point)
    environment:
      # Use the built-in Derby DB (simplest possible)
      JF_SHARED_DATABASE_TYPE: derby
    # Optional: give it more memory if you have it
    # environment:
    #   - JF_SHARED_DATABASE_TYPE=derby
    #   - EXTRA_JAVA_OPTIONS=-Xms512m -Xmx2g
    ulimits:
      nproc: 65535
      nofile:
        soft: 32000
        hard: 40000
  dodbanner:
    image: dodbanner:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      BACKEND_HOST: artifactory
      BACKEND_PORT: "8082"
      LISTEN_PORT: "9999"

      # Alertmanager serves its web UI from the root path.
      # Exclude static assets and other non-HTML resources.
      INJECT_PATH_REGEX: "^/(?!.*\\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map|json)$).*"

      INJECT_BEFORE: "</head>"
      INJECT_CSS: "artifactory-banner.css"

      CLASSIFICATION: "UNCLASSIFIED"
      CLASSIFICATION_LABEL: "smeg"
