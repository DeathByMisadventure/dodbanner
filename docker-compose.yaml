services:

  # -------------------------------------------------
  # Alertmanager
  # -------------------------------------------------
  #
  # Development-only Alertmanager instance.
  # Alertmanager itself is NOT exposed directly to
  # the host -- only the dodbanner proxy is exposed.
  #
  # UI through dodbanner:
  #   http://localhost:9999
  #

  alertmanager:
    image: quay.io/prometheus/alertmanager:latest
    restart: unless-stopped
    expose:
      - "9093"

  # -------------------------------------------------
  # DoD Banner Injection Proxy
  # -------------------------------------------------
  #
  # Host:
  #   http://localhost:9999
  #

  dodbanner:
    image: dodbanner:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      BACKEND_HOST: alertmanager
      BACKEND_PORT: "9093"
      LISTEN_PORT: "9999"

      # Alertmanager serves its web UI from the root path.
      # Exclude static assets and other non-HTML resources.
      INJECT_PATH_REGEX: "^/(?!.*\\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map|json)$).*"

      INJECT_BEFORE: "</head>"
      INJECT_CSS: "alertmanager-banner.css"

      CLASSIFICATION: "UNCLASSIFIED"
      CLASSIFICATION_LABEL: "smeg"

    depends_on:
      - alertmanager
