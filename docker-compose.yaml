
services:

  # -------------------------------------------------
  # Keycloak
  # -------------------------------------------------
  #
  # Development-only Keycloak instance.
  # Keycloak itself is NOT exposed directly to the host --
  # only the dodbanner proxy below is exposed.
  #
  # UI:
  #   http://localhost:9999
  #
  # Admin:
  #   http://localhost:9999/admin
  #
  # Credentials:
  #   admin / admin
  #

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME: "http://localhost:9999"
    expose:
      - "8080"


  # -------------------------------------------------
  # DoD Banner Injection Proxy
  # -------------------------------------------------
  #
  # Host:
  #   http://localhost:9999
  #

  dodbanner:
    image: dodbanner:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      BACKEND_HOST: keycloak
      BACKEND_PORT: "8080"
      LISTEN_PORT: "9999"

      # Keycloak serves multiple applications/pages from the
      # same server. Initially inject into HTML responses while
      # excluding static assets.
      INJECT_PATH_REGEX: "^/(?!.*\\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map|json)$).*"

      INJECT_BEFORE: "</head>"
      INJECT_CSS: "keycloak-banner.css"

      CLASSIFICATION: "CUI"
      CLASSIFICATION_LABEL: "TEST"

    depends_on:
      - keycloak
