services:

  # -------------------------------------------------
  # HashiCorp Vault
  # -------------------------------------------------
  #
  # Development-only Vault instance.
  # The UI/API are NOT exposed directly to the host.
  #
  vault:
    image: hashicorp/vault:2.0.3
    restart: unless-stopped
    command: server -dev -dev-root-token-id root -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
    expose:
      - "8200"


  # -------------------------------------------------
  # DoD Banner Injection Proxy
  # -------------------------------------------------

  dodbanner:
    image: dodbanner:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      BACKEND_HOST: vault
      BACKEND_PORT: "8200"
      LISTEN_PORT: "9999"

      # Vault's UI is served from /ui.
      # Only modify the HTML entry point; don't touch
      # JavaScript, CSS, API, or static asset requests.
      INJECT_PATH_REGEX: "^/ui/.*$"
      INJECT_BEFORE: "</head>"

      # Application-specific customization.
      INJECT_CSS: "vault-banner.css"

      CLASSIFICATION: "SECRET"
      CLASSIFICATION_LABEL: "NOFORN"

    depends_on:
      - vault

