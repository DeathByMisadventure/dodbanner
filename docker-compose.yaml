services:
  # -------------------------------------------------
  # PostgreSQL for SonarQube
  # -------------------------------------------------
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data

  # -------------------------------------------------
  # SonarQube
  # -------------------------------------------------
  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    # Only expose internally
    expose:
      - "9000"
    # SonarQube needs a bit more memory
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # -------------------------------------------------
  # DoD Banner Injection Proxy
  # -------------------------------------------------
  dodbanner:
    image: dodbanner:latest
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      BACKEND_HOST: sonarqube
      BACKEND_PORT: "9000"
      LISTEN_PORT: "9999"

      # SonarQube is mostly a SPA after login
      INJECT_PATH_REGEX: "^/(?!api|static|css|js|images|favicon|.*\\.(js|css|png|jpg|svg|ico|woff2?)$).*$"

      INJECT_BEFORE: "</head>"
      INJECT_CSS: "sonarqube-banner.css"

    depends_on:
      - sonarqube

volumes:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:
